spring.application.name=expense-tracker
server.port=8080

# ---- Database (MySQL). Change user/password or set DB_USER / DB_PASSWORD env variables ----
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:kharcha}
spring.datasource.password=${DB_PASSWORD:kharcha123}

# Tables are created by sql/schema.sql (copied into resources) - Hibernate only maps to them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Nightly notification ----
# Spring cron: second minute hour day month weekday. Default = every night at 9:00 PM.
tracker.notification.cron=0 0 21 * * *
tracker.notification.zone=Asia/Kolkata

# Telegram bot (free, easiest). Put values in environment variables, do not commit them.
tracker.telegram.token=${TELEGRAM_BOT_TOKEN:}
tracker.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Optional email notification. Fill these and uncomment the spring.mail lines.
tracker.email.to=${NOTIFY_EMAIL_TO:}
tracker.email.from=${MAIL_USER:}
